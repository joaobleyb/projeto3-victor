{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Clínica{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'atendimentos/css/style.css' %}">
</head>
<body>
  <nav>
    <span class="marca"><a href="{% url 'home' %}">Clínica</a></span>
    <a href="{% url 'consulta_list' %}">Consultas</a>
    <a href="{% url 'paciente_list' %}">Pacientes</a>
    <a href="{% url 'medico_list' %}">Médicos</a>
    <a href="{% url 'especialidade_list' %}">Especialidades</a>
  </nav>
  <main>
    {% for message in messages %}
      <div class="msg {{ message.tags }}">{{ message }}</div>
    {% endfor %}
    <div class="card">{% block content %}{% endblock %}</div>
  </main>
</body>
</html>
